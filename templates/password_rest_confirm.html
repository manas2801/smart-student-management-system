{% extends 'base.html' %}

{% block content %}

<div class="card"
     style="max-width:500px; margin:auto;">

    <h2 class="section-title">
        Set New Password
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn">

            Change Password

        </button>

    </form>

</div>

{% endblock %}
